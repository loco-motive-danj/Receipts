  jobs:
    run-parser:
      runs-on: ubuntu-latest
      steps:
        # 🔄 Fresh clone (no cache)
        - name: Checkout repo (no cache)
          uses: actions/checkout@v4
          with:
            clean: true
            fetch-depth: 0

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.11'

        - name: Install dependencies
          run: |
            pip install -r requirements.txt

        - name: Write service account JSON to file
          run: |
            printf '%s' "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json

        - name: Run receipt parser
