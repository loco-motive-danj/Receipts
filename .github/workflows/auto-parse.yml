  What’s wrong and why secrets appear “not working”

  The code hard-requires SERVICE_ACCOUNT_KEY_B64. If that repository secret isn’t set (or is empty), your job will print “SERVICE_ACCOUNT_KEY_B64 is missing or empty!” and exit. Writing service_account.json from SERVICE_ACCOUNT_JSON won’t help because the script exits before falling back to a file (there is no fallback).
  You set AZURE_ENDPOINT via a secret in the workflow, but the code uses a hardcoded endpoint constant and ignores the env var; so that secret has no effect.
  Using echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json for a multi-line JSON can sometimes introduce formatting issues; prefer printf (see below).
  Minor security issue: the code prints the first 100 chars of your decoded service account JSON; this may leak sensitive data in logs.
  Two clean fixes (choose one)

  Option A: Make the code robust (fallback to the file already written by the workflow)

  Change the top of main.py to use env if present, else read the file:
  encoded = os.getenv("SERVICE_ACCOUNT_KEY_B64")
  if encoded:
      creds_data = json.loads(base64.b64decode(encoded).decode("utf-8"))
  else:
      with open("service_account.json") as f:
          creds_data = json.load(f)
  Also read endpoint from env if provided:
  AZURE_ENDPOINT = os.getenv("AZURE_ENDPOINT", "https://receiptinvoiceaid.cognitiveservices.azure.com/")
  Remove the “Decoded JSON preview” print.
  Option B: Keep the code as-is and provide the expected base64 secret in the workflow

  Ensure the repository secret SERVICE_ACCOUNT_KEY_B64 is actually set. If you only have SERVICE_ACCOUNT_JSON, derive and export the base64 at runtime:
  - name: Export base64 service account to env
    run: echo "SERVICE_ACCOUNT_KEY_B64=$(printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' | base64 -w0)" >> $GITHUB_ENV
  Then keep your step that runs python main.py (it will see SERVICE_ACCOUNT_KEY_B64).
  Hardening the workflow file writing

  Use printf instead of echo for multiline secrets:
  - name: Write service account JSON to file
    run: |
      printf '%s' "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json
  Quick checklist to unblock you now

  Verify repository secrets exist and are non-empty: AZURE_KEY, SERVICE_ACCOUNT_KEY_B64 (or implement Option A/derivation step).
  If you rely on environment-scoped secrets, add environment: <name> under the job.
  Update main.py to use os.getenv("AZURE_ENDPOINT", default) so the AZURE_ENDPOINT secret is honored.
  Remove the decoded JSON preview print to avoid leaking secrets.
