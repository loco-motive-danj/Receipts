name: Auto Parse Receipts

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual trigger

  jobs:
  run-parser:
    runs-on: ubuntu-latest
    steps:
      # 🔄 Fresh clone (no cache)
      - name: Checkout repo (no cache)
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Write service account JSON to file
        run: |
          printf '%s' "${{ secrets.SERVICE_ACCOUNT_JSON }}" > service_account.json

      - name: Derive SERVICE_ACCOUNT_KEY_B64 from JSON secret
        run: echo "SERVICE_ACCOUNT_KEY_B64=$(printf '%s' '${{ secrets.SERVICE_ACCOUNT_JSON }}' | base64 -w0)" >> $GITHUB_ENV

      - name: Run receipt parser
        env:
          AZURE_KEY: ${{ secrets.AZURE_KEY }}
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}   # will be read by your code if you switched to os.getenv
          SERVICE_ACCOUNT_KEY_B64: ${{ secrets.SERVICE_ACCOUNT_KEY_B64 }}  # only if you use the base64 path
        run: |
          python main.py

    - name: Commit & push results
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add outputs/*.xlsx || true
        git commit -m "Auto-update parsed receipts" || echo "No changes"
        git push || true


